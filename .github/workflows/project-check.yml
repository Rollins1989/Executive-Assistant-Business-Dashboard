name: Project checks

on:
  push:
    paths:
      - 'Business Project/Executive_Assistant_Business_Dashboard/**'
      - '.github/workflows/project-check.yml'
  pull_request:
    paths:
      - 'Business Project/Executive_Assistant_Business_Dashboard/**'
      - '.github/workflows/project-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Business Project/Executive_Assistant_Business_Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'Business Project/Executive_Assistant_Business_Dashboard/requirements.txt'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
